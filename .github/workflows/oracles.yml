name: Oracles

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:

jobs:
  interfaces:
    # The rosidl version Package.resolved pins; it moves with Package.resolved, never @main.
    uses: swift-ros2/swift-ros2-rosidl/.github/workflows/interface-oracles.yml@1.0.0-rc.1
    with:
      corpus-product: CommonInterfacesOracleCorpus
